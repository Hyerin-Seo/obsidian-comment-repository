<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>옵시디언에서 열기</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; }
  #name { font-weight: 600; margin: 8px 0 16px; word-break: break-all; }
  a { color: #7c6fd6; }
  small { opacity: .6; }
</style>
</head>
<body>
<main>
  <p id="msg">옵시디언을 여는 중…</p>
  <p id="name"></p>
  <p><a id="go" href="#">안 열리면 여기를 누르세요</a></p>
  <p><small>처음 한 번은 브라우저가 "Obsidian 을 열까요?" 하고 묻습니다 — 항상 허용을 켜 두면 다음부터 바로 열립니다.</small></p>
</main>
<script>
  // 슬랙 알림의 `옵시디언에서 열기 →` 가 여기로 옵니다. 슬랙이 obsidian:// 링크를 막아서 한 번 거칩니다.
  // 볼트 이름·노트 경로는 주소의 # 뒤에만 있어서 이 서버(GitHub)로 안 갑니다 — 브라우저 안에서만 읽습니다.
  var p = new URLSearchParams(location.hash.slice(1));
  var vault = p.get("vault"), file = p.get("file");
  var go = document.getElementById("go");
  if (vault && file) {
    var url = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file);
    document.getElementById("name").textContent = file.split("/").pop();
    go.href = url;
    location.replace(url);
  } else {
    document.getElementById("msg").textContent = "열 노트가 주소에 없습니다.";
    go.remove();
  }
</script>
</body>
</html>
